project: life_insurance_rag
provider: local

registry:
  registry_type: sql
  path: postgresql+psycopg://feast:feast@${FEAST_PG_HOST:-localhost}:${FEAST_PG_PORT:-5432}/feast
  cache_ttl_seconds: 60
  sqlalchemy_config_kwargs:
    echo: false
    pool_pre_ping: true

online_store:
  type: postgres
  host: ${FEAST_PG_HOST:-localhost}
  port: ${FEAST_PG_PORT:-5432}
  database: feast
  db_schema: public
  user: feast
  password: feast
  sslmode: disable
  vector_enabled: true

offline_store:
  type: file

embedding_model:
  provider: sentence_transformers
  model: all-MiniLM-L6-v2

feature_server:
  type: mcp
  enabled: true
  mcp_enabled: true
  mcp_transport: http
  mcp_server_name: "life-insurance-rag"
  mcp_server_version: "1.0.0"
  feature_logging:
    enabled: false

auth:
  type: no_auth

entity_key_serialization_version: 3
