# Feast data-stores secret for the FeatureStore operator.
# Contains connection strings for the SQL registry and PostgreSQL online store.
# The operator injects these into the feature_store.yaml it generates.
apiVersion: v1
kind: Secret
metadata:
  name: feast-data-stores
  namespace: life-insurance-rag
stringData:
  # SQL registry (PostgreSQL-backed for HA and multi-pod access)
  sql: |
    path: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres.life-insurance-rag.svc.cluster.local:5432/${POSTGRES_DB}
    cache_ttl_seconds: 60
    sqlalchemy_config_kwargs:
        echo: false
        pool_pre_ping: true
  # Online store (PostgreSQL with pgvector)
  postgres: |
    host: postgres.life-insurance-rag.svc.cluster.local
    port: 5432
    database: ${POSTGRES_DB}
    db_schema: public
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    vector_enabled: true
    sslmode: disable
